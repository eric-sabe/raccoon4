AccountLogic.about=Please log in with your Google account to access the Play Store.<p><strong>Supported credentials:</strong> Enter your Google email and either a 16-character <a href="https://myaccount.google.com/apppasswords">Google App Password</a>, an <code>aas_et/...</code> Master Token, or an <code>oauth2_4/...</code> OAuth token.
