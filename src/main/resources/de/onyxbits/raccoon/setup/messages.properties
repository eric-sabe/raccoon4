ExistingLogic.about=You can click <strong>Read from Connected Phone (ADB)</strong> to automatically read the hardware profile from a USB-connected Android phone (make sure USB Debugging is enabled and authorized on the phone). If GSF ID is left blank, Raccoon will register a new GSF ID using the phone's User-Agent.
