plugins {
    id "java"
    id "application"
    id "eclipse"
}

// Settings
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'de.onyxbits.raccoon.Main'
}

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
}

tasks.register('fatJar', Jar) {
    manifest {
        // version can be changed via 'gradle.properties' file
        attributes(
            'Implementation-Version': project.version,
            'Main-Class': 'de.onyxbits.raccoon.Main'
        )
    }
    archiveBaseName.set(project.name)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'
    with jar
}

// In this section you declare the dependencies for your production and test code
dependencies {
    implementation 'net.dongliu:apk-parser:2.6.10'
    implementation 'org.hsqldb:hsqldb:2.7.4'
    implementation 'org.eclipse.jetty:jetty-server:8.1.22.v20160922'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'commons-io:commons-io:2.17.0'
    implementation 'commons-cli:commons-cli:1.9.0'
    implementation 'org.bouncycastle:bctls-jdk18on:1.78.1'

    testImplementation 'junit:junit:4.13.2'
}

wrapper {
    gradleVersion = "9.7.1"
    distributionType = Wrapper.DistributionType.BIN
}